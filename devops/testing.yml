name: Testing

concurrency:
    group: testing-workflow-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: false

# Required IAM Permissions for cleanup-amplify job:
# The IAM user 'amplify-ci' needs the following permissions:
# - amplify:DeleteBranch
# - amplify:StopJob
# Resource: arn:aws:amplify:eu-central-1:123456789012:apps/*/branches/*
#
# Without these permissions, branch cleanup will fail with permission errors.
#
# IMPORTANT: This job will FAIL if branch cleanup cannot be completed.
# This is intentional because:
# 1. Failed cleanup means branches accumulate in AWS (costing money)
# 2. It forces attention to the underlying issue (IAM, OAuth, or branch protection)
# 3. Prevents false "success" when the workflow didn't actually complete properly

on:
    push:
        branches: [main, development]
    pull_request:
    merge_group:

permissions:
    id-token: write
    contents: read

env:
    NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}

jobs:
    lint-locales:
        name: Lint Locales (Translations) Files
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9.12.1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint locale files
              run: pnpm lint-locales

    deploy-amplify:
        uses: ./.github/workflows/amplify-deployment.yml
        with:
            branch_name: ${{ github.head_ref }}
        secrets: inherit
        if: github.event_name == 'pull_request'

    comment-amplify-url:
        name: Comment Test on PR
        needs: [deploy-amplify, test-e2e]
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request' && needs.deploy-amplify.outputs.deployment-ready == 'true' && needs.deploy-amplify.outputs.amplify-url
        environment:
            name: amplify
        permissions:
            pull-requests: write
            issues: write
        steps:
            - name: Comment on PR
              uses: actions/github-script@v6
              with:
                  script: |
                      const { url, branch } = process.env;
                      const testsPassed = '${{ needs.test-e2e.result }}' === 'success';

                      const branchCreated = process.env.BRANCH_CREATED === 'true';
                      const status = branchCreated ? 'New branch created and deploying' : 'Branch already exists, deploying latest changes';

                      let comment = `## 🚀 Tests`;

                      if (testsPassed) {
                        comment += `

                        ✅ **E2E Tests:** All tests passed successfully!`;
                      } else {
                        comment += `

                        ⚠️ **E2E Tests:** Auto tests failed.`;
                      }

                      comment += `

                      ---
                      *This comment was automatically generated by GitHub Actions*`;

                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: comment
                      });
              env:
                  url: ${{ needs.deploy-amplify.outputs.amplify-url }}
                  branch: ${{ github.head_ref }}
                  BRANCH_CREATED: ${{ needs.deploy-amplify.outputs.branch-created || 'false' }}

    test-e2e:
        name: Run E2E Tests
        needs: [lint-locales, deploy-amplify]
        runs-on: ubuntu-24.04
        if: github.event_name == 'pull_request'
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9.12.1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install chromium --with-deps

            - name: Debug Amplify outputs
              run: |
                  echo "🔍 Debug Amplify outputs:"
                  echo "deployment-ready: ${{ needs.deploy-amplify.outputs.deployment-ready }}"
                  echo "amplify-url: ${{ needs.deploy-amplify.outputs.amplify-url }}"
                  echo "branch-created: ${{ needs.deploy-amplify.outputs.branch-created }}"

            - name: Debug test URL
              run: |
                  echo "🌐 E2E tests will run against:"
                  echo "   BASE_URL → ${{ needs.deploy-amplify.outputs.amplify-url }}"

            - name: Run Playwright tests
              run: pnpm e2e:test:remote:priority --project=chromium
              env:
                  BASE_URL: ${{ needs.deploy-amplify.outputs.amplify-url }}
                  TEST_WORKSPACE_ID: ${{ secrets.TEST_WORKSPACE_ID }}
                  TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
                  TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
                  ACCOUNTS_URL: ${{ secrets.ACCOUNTS_URL }}
                  CI: true

    cleanup-amplify:
        name: Cleanup Amplify Branch
        needs: [test-e2e, deploy-amplify]
        runs-on: ubuntu-latest
        environment:
            name: amplify
        if: ${{ always() && github.event_name == 'pull_request' }}
        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'eu-central-1' }}

            - name: Cleanup Amplify Branch
              run: |
                  BRANCH_NAME="${{ github.head_ref }}"
                  APP_ID="${{ secrets.AMPLIFY_APP_ID }}"

                  echo "🔍 Debug Information:"
                  echo "  Branch Name: '$BRANCH_NAME'"
                  echo "  App ID: '$APP_ID'"
                  echo "  AWS Region: $AWS_REGION"

                  # List all branches to see what's available
                  # echo "📋 Listing all branches in the app:"
                  # aws amplify list-branches --app-id "$APP_ID" --output table || echo "Failed to list branches"

                  # Try to get the specific branch with verbose output
                  echo "🔍 Looking for specific branch '$BRANCH_NAME':"
                  if ! aws amplify get-branch --app-id "$APP_ID" --branch-name "$BRANCH_NAME" --output json 2>&1; then
                    echo "ℹ️ Branch not found, nothing to delete."
                    exit 0
                  fi

                  BRANCH_INFO=$(aws amplify get-branch --app-id "$APP_ID" --branch-name "$BRANCH_NAME" --output json)
                  ACTIVE_JOB_ID=$(echo "$BRANCH_INFO" | jq -r '.branch.activeJobId // empty')

                  if [ -n "$ACTIVE_JOB_ID" ] && [ "$ACTIVE_JOB_ID" != "0000000000" ]; then
                      JOB_STATUS=$(aws amplify get-job \
                          --app-id "$APP_ID" \
                          --branch-name "$BRANCH_NAME" \
                          --job-id "$ACTIVE_JOB_ID" \
                          --query 'job.summary.status' \
                          --output text 2>/dev/null || echo "UNKNOWN")

                      if [[ "$JOB_STATUS" == "RUNNING" || "$JOB_STATUS" == "PENDING" ]]; then
                          echo "Stopping active job $ACTIVE_JOB_ID..."
                          aws amplify stop-job --app-id "$APP_ID" --branch-name "$BRANCH_NAME" --job-id "$ACTIVE_JOB_ID" || true
                      else
                          echo "Job is in terminal state ($JOB_STATUS), clearing activeJobId..."
                          aws amplify update-branch \
                              --app-id "$APP_ID" \
                              --branch-name "$BRANCH_NAME" \
                              --output json >/dev/null || true
                      fi
                  fi

                  echo "Deleting branch $BRANCH_NAME..."
                  if aws amplify delete-branch --app-id "$APP_ID" --branch-name "$BRANCH_NAME"; then
                      echo "✅ Branch $BRANCH_NAME deleted successfully!"
                  else
                      echo "❌ Failed to delete branch $BRANCH_NAME"
                      echo "🔍 This might be due to branch protection rules or associated resources"
                      echo "💡 Check the AWS Amplify console for any branch settings"
                      exit 1
                  fi
